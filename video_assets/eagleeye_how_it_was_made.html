:root {
  --bg: #EEEFEC; --fg: #17191D; --muted: #666A72; --line: #CDD0D4; --control: #FFFFFF; --focus: #FF5A1F;
  --font: "BVP", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141518; --fg: #ECEDEF; --muted: #9A9EA6; --line: #33363C; --control: #1E2024; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #141518; --fg: #ECEDEF; --muted: #9A9EA6; --line: #33363C; --control: #1E2024; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--font); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 32px; }
.page { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.page h1 { font-weight: 700; font-size: 22px; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.page p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; max-width: 72ch; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar button, .bar select { font: 500 13px var(--font); color: var(--fg); background: var(--control); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
.bar button.primary { background: var(--focus); border-color: var(--focus); color: #fff; min-width: 74px; }
.bar button:focus-visible, .bar select:focus-visible, .bar input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.bar input[type=range] { flex: 1 1 220px; min-width: 0; accent-color: var(--focus); }
.bar .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; min-width: 8ch; text-align: right; }
.wrap { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 8px; border: 1px solid var(--line); }
.wrap:fullscreen { border: 0; border-radius: 0; background: #000; }
.bg-checker { background-color: #fff; background-image: conic-gradient(#dcdcdc 25%, #fff 0 50%, #dcdcdc 0 75%, #fff 0); background-size: 40px 40px; }
.bg-dark { background: #2b2d31; }
.bg-green { background: #00B140; }

/* ---------- stage ---------- */
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; font-family: "BVP", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
#panel { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: #FFFFFF; overflow: hidden; will-change: transform; }
#world { position: absolute; left: 0; top: 0; width: 1px; height: 1px; transform-origin: 0 0; will-change: transform; }
.abs { position: absolute; }
.stop { position: absolute; width: 1920px; height: 1080px; }
.pill { position: absolute; left: 170px; top: 196px; background: #FF5A1F; color: #fff; font-weight: 700; font-size: 24px; letter-spacing: .09em; padding: 11px 20px 10px; border-radius: 999px; white-space: nowrap; }
.pill b { font-weight: 700; opacity: .72; margin-right: 14px; }
.sent { position: absolute; left: 170px; top: 270px; width: 1580px; font-weight: 600; font-size: 58px; line-height: 1.14; letter-spacing: -.018em; color: #16181D; }
.line { display: block; overflow: hidden; padding-bottom: .06em; margin-bottom: -.06em; }
.line > span { display: inline-block; will-change: transform; }
.cap { position: absolute; transform: translateX(-50%); white-space: nowrap; text-align: center; font-weight: 500; font-size: 28px; color: #6B7079; }
.big { font-weight: 700; font-size: 54px; letter-spacing: -.02em; color: #16181D; }
.shadow { box-shadow: 0 1px 2px rgba(20,24,32,.06), 0 22px 44px -22px rgba(20,24,32,.28); }
.title { position: absolute; left: 0; width: 1920px; top: 420px; text-align: center; font-weight: 700; font-size: 132px; line-height: 1.02; letter-spacing: -.035em; color: #16181D; }
.coinflat { position: absolute; border-radius: 50%; background: #DDE0E5; box-shadow: inset 0 0 0 11px #CBCFD6; display: grid; place-items: center; font-weight: 600; font-size: 50px; color: #8C929C; }
.card { position: absolute; border-radius: 30px; display: grid; place-items: center; }
.node { position: absolute; width: 560px; height: 150px; border-radius: 30px; background: #fff; display: flex; flex-direction: column; justify-content: center; padding: 0 40px; box-sizing: border-box; }
.node .t { font-weight: 700; font-size: 40px; letter-spacing: -.02em; color: #16181D; line-height: 1.1; }
.node .s { font-weight: 500; font-size: 25px; color: #6B7079; margin-top: 6px; }
.node.soft { background: #F2F3F5; box-shadow: none; }
.node.bad { background: #FDEDEA; box-shadow: none; } .node.bad .t { color: #C8371E; } .node.bad .s { color: #A4523F; }
.node.good { background: #E6F4EC; box-shadow: none; } .node.good .t { color: #187A45; } .node.good .s { color: #3E7C59; }
.blabel { position: absolute; font-weight: 600; font-size: 28px; color: #6B7079; transform: translate(-50%, -50%); white-space: nowrap; background: #fff; padding: 2px 10px; }
svg.route { position: absolute; left: 0; top: 0; overflow: visible; }
svg.route path.p { fill: none; stroke: #D3D6DB; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
svg.route path.h { fill: none; stroke: #D3D6DB; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
svg.route path.dash { fill: none; stroke: #C4C8CE; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 2 18; }

html.render body { background: transparent !important; padding: 0 !important; }
html.render .page > :not(.wrap) { display: none !important; }
html.render .page { max-width: none; gap: 0; }
html.render .wrap { width: 1920px; height: 1080px; aspect-ratio: auto; border: 0; border-radius: 0; background: transparent !important; }
</style>

<div class="page">
  <h1>EagleEye: how it was made</h1>
  <p>Second-half explainer. Scrub, jump to a step, or play it through. Text, timing and positions live in the CONFIG block at the top of the script. Checker shows where the frame is transparent before the white panel rises.</p>
  <div class="bar">
    <button id="play" class="primary" type="button">Play</button>
    <button id="restart" type="button">Restart</button>
    <select id="jump" aria-label="Jump to section"></select>
    <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" aria-label="Scrub timeline">
    <span class="time" id="time">0.00s</span>
    <select id="bgsel" aria-label="Preview background">
      <option value="bg-checker">Checker</option>
      <option value="bg-dark">Dark</option>
      <option value="bg-green">Green</option>
    </select>
    <button id="fs" type="button">Fullscreen</button>
  </div>

tl.to({}, { duration: Math.max(0, END - tl.duration()) });
const DUR = END;

/* ---------- camera evaluation ---------- */
function camAt(t) {
